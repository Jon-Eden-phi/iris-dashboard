<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-mark">I</div>
      <div>
        <div style="font-weight:800; font-size:18px; letter-spacing:-0.02em;">Iris 2.0</div>
        <div style="font-size:12px; color:var(--text3);">SimplyPhi Property Intelligence</div>
      </div>
    </div>

    @if (error()) {
      <div class="login-error">{{ error() }}</div>
    }

    <div class="form-group">
      <label class="form-label">Email address</label>
      <input class="form-input" type="email" placeholder="you@example.com"
             [value]="email()" (input)="setEmail($any($event.target).value)" />
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-input" type="password" placeholder="••••••••"
             [value]="password()" (input)="setPassword($any($event.target).value)"
             (keyup.enter)="submit()" />
    </div>
    <button class="btn-primary login-btn" (click)="submit()" [disabled]="loading()">
      @if (loading()) { Signing in… } @else { Sign in }
    </button>

  </div>
</div>
